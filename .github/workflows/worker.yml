# Worker Video2Skill sur GitHub Actions (gratuit).
#
# Déclenché : automatiquement par l'app à chaque job créé (repository_dispatch
# "process-jobs"), manuellement (onglet Actions → Run workflow), et par un cron
# de secours toutes les 6 h qui ramasse les jobs orphelins.
#
# Secrets à définir (repo → Settings → Secrets and variables → Actions) :
#   DATABASE_URL           URL Supabase pooler SESSION (port 5432 — IPv4)
#   BLOB_READ_WRITE_TOKEN  token Vercel Blob
#   OPENAI_API_KEY         transcription
#   ANTHROPIC_API_KEY      vision + synthèse + audit — REQUISE par défaut
#                          (mets les Variables VISION/SYNTHESIS/QUALITY_PROVIDER
#                          à 'openai' si tu veux t'en passer)
#
# Les Variables (même écran, onglet Variables) permettent de changer modèles et
# budget d'images sans redéployer. Toutes ont un défaut ci-dessous.
name: worker

on:
  repository_dispatch:
    types: [process-jobs]
  workflow_dispatch:
  # Auto-test : toute modification du worker déclenche un drain (et ramasse
  # au passage les jobs en attente).
  push:
    branches: [main]
    paths:
      - ".github/workflows/worker.yml"
      - "worker/**"
      - "src/lib/**"
  schedule:
    # Filet de sécurité (si un dispatch se perd). Supprime ce bloc pour
    # économiser les minutes gratuites sur un repo privé.
    - cron: "17 */6 * * *"

# Un seul worker à la fois ; un dispatch pendant un run reste en attente puis
# s'exécute (et trouve une file déjà vidée → s'arrête en ~1 min).
concurrency:
  group: video2skill-worker
  cancel-in-progress: false

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Vérifier la configuration
        id: check
        env:
          BASE_OK: ${{ secrets.DATABASE_URL != '' && secrets.BLOB_READ_WRITE_TOKEN != '' && secrets.OPENAI_API_KEY != '' }}
          HAS_ANTHROPIC: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          # Doivent rester identiques aux valeurs passées à l'étape « Traiter ».
          VISION_PROVIDER: ${{ vars.VISION_PROVIDER || 'anthropic' }}
          SYNTHESIS_PROVIDER: ${{ vars.SYNTHESIS_PROVIDER || 'anthropic' }}
          QUALITY_PROVIDER: ${{ vars.QUALITY_PROVIDER || vars.SYNTHESIS_PROVIDER || 'anthropic' }}
        run: |
          if [ "$BASE_OK" != "true" ]; then
            echo "::warning::Secrets manquants (DATABASE_URL, BLOB_READ_WRITE_TOKEN, OPENAI_API_KEY) — run ignoré."
            echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # ANTHROPIC_API_KEY n'est requise que si un étage est sur "anthropic" —
          # ce qui est le cas par défaut depuis le passage de la vision sur Haiku.
          # Sans elle, chaque job échouerait un par un après avoir payé ffmpeg.
          NEEDS_ANTHROPIC=false
          for p in "$VISION_PROVIDER" "$SYNTHESIS_PROVIDER" "$QUALITY_PROVIDER"; do
            [ "$p" = "anthropic" ] && NEEDS_ANTHROPIC=true
          done
          if [ "$NEEDS_ANTHROPIC" = "true" ] && [ "$HAS_ANTHROPIC" != "true" ]; then
            echo "::error::ANTHROPIC_API_KEY manquante alors que vision/synthèse/audit sont sur 'anthropic'. Ajoute le secret, ou mets les Variables VISION_PROVIDER / SYNTHESIS_PROVIDER / QUALITY_PROVIDER à 'openai'."
            echo "ok=false" >> "$GITHUB_OUTPUT"; exit 1
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.check.outputs.ok == 'true'
        uses: actions/checkout@v4

      - name: Node 22
        if: steps.check.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install FFmpeg + Tesseract
        if: steps.check.outputs.ok == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg tesseract-ocr tesseract-ocr-fra tesseract-ocr-eng
          ffmpeg -version | head -1

      - name: Installer les dépendances
        if: steps.check.outputs.ok == 'true'
        run: npm ci

      - name: Traiter la file de jobs
        if: steps.check.outputs.ok == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DATABASE_URL }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

          # --- Facturation. Doivent correspondre aux valeurs de l'app, sinon le
          # worker solde les crédits sur un barème différent de celui affiché.
          CREDITS_PER_MINUTE: ${{ vars.CREDITS_PER_MINUTE || '1' }}
          TRANSCRIPT_MINUTES_PER_CREDIT: ${{ vars.TRANSCRIPT_MINUTES_PER_CREDIT || '3' }}

          # --- Providers IA. Modifiables sans toucher au code via
          # Settings → Secrets and variables → Actions → Variables.
          # La vision est un appel PAR IMAGE et ne fait que de l'extraction JSON :
          # c'est le poste le plus cher et le moins exigeant, d'où Haiku. La
          # synthèse et l'audit sont un appel chacun, là où le modèle compte.
          TRANSCRIPTION_PROVIDER: ${{ vars.TRANSCRIPTION_PROVIDER || 'openai' }}
          VISION_PROVIDER: ${{ vars.VISION_PROVIDER || 'anthropic' }}
          SYNTHESIS_PROVIDER: ${{ vars.SYNTHESIS_PROVIDER || 'anthropic' }}
          QUALITY_PROVIDER: ${{ vars.QUALITY_PROVIDER || vars.SYNTHESIS_PROVIDER || 'anthropic' }}
          ANTHROPIC_VISION_MODEL: ${{ vars.ANTHROPIC_VISION_MODEL || 'claude-haiku-4-5' }}
          ANTHROPIC_SYNTHESIS_MODEL: ${{ vars.ANTHROPIC_SYNTHESIS_MODEL || 'claude-sonnet-5' }}
          ANTHROPIC_QUALITY_MODEL: ${{ vars.ANTHROPIC_QUALITY_MODEL || vars.ANTHROPIC_SYNTHESIS_MODEL || 'claude-sonnet-5' }}
          OPENAI_TRANSCRIBE_MODEL: ${{ vars.OPENAI_TRANSCRIBE_MODEL || 'gpt-4o-transcribe' }}

          # --- Budget d'images. Le coût de la vision est directement
          # FRAMES_PER_MINUTE × durée, borné par MIN/MAX.
          FRAMES_PER_MINUTE: ${{ vars.FRAMES_PER_MINUTE || '3' }}
          MIN_VISION_FRAMES: ${{ vars.MIN_VISION_FRAMES || '12' }}
          MAX_VISION_FRAMES: ${{ vars.MAX_VISION_FRAMES || '60' }}
          VISION_CONCURRENCY: ${{ vars.VISION_CONCURRENCY || '4' }}
          VISION_RETRY_MAX_FRAMES: ${{ vars.VISION_RETRY_MAX_FRAMES || '8' }}
          QUALITY_MIN_SCORE: ${{ vars.QUALITY_MIN_SCORE || '80' }}
          OCR_LANGS: ${{ vars.OCR_LANGS || 'fra+eng' }}
          AUDIO_CODEC: ${{ vars.AUDIO_CODEC || 'flac' }}

        run: npm run worker:drain
