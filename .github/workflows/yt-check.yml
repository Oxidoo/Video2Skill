# Diagnostic d'ingestion YouTube.
#
# Actions → yt-check → Run workflow → colle une URL YouTube.
#
# Répond à la seule question utile quand un job YouTube échoue : qu'est-ce que
# CE runner voit ? Le même code réussit sur un portable et échoue sur une IP de
# datacenter, donc lancer ça avant de soupçonner le pipeline évite de chercher
# au mauvais endroit. Ne télécharge que l'audio : rapide, et aucun crédit
# consommé (aucun job n'est créé).
name: yt-check

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL YouTube à tester"
        required: true
        default: "https://www.youtube.com/watch?v=dQw4w9WgXcQ"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Même runtime JS que le worker : sans lui yt-dlp bascule sur des clients
      # dégradés, et le diagnostic ne refléterait pas la production.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install FFmpeg + yt-dlp
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          sudo curl -sL https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp

      - name: Installer les dépendances
        run: npm ci

      - name: Diagnostic
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
          YTDLP_PROXY: ${{ secrets.YTDLP_PROXY }}
          YTDLP_EXTRA_ARGS: ${{ vars.YTDLP_EXTRA_ARGS }}
        run: npm run yt:check -- "${{ inputs.url }}"
